<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Campaign Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/DnD-Campaigns/manifest.json">
</head>
<body>
    <header>
        <h1>D&D Campaign Tracker</h1>
    </header>

    <!-- UI per Login/Logout - AGGIUNTA QUI -->
    <div id="authDiv">
        <h2>Gestione Account</h2>
        <p id="authStatus">Caricamento stato utente...</p>
        <div id="authInputs">
            <input type="email" id="emailInput" placeholder="Email" autocomplete="username">
            <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password">
            <button id="loginButton">Login</button>
            <button id="signupButton">Registrati</button>
        </div>
        <button id="logoutButton" style="display: none;">Logout</button>
    </div>
    <!-- Fine UI per Login/Logout -->

    <div id="campaignsDiv" style="display: none;"> <!-- Nascondi inizialmente, mostreremo dopo il login -->
        <div class="db-actions">
            <button id="exportDbButton">Esporta Database</button>
            <input type="file" id="importFileInput" accept=".json" style="display: none;">
            <button id="importDbButton">Importa Database</button>
        </div>

        <button id="addNewCampaignButton">Add new campaign</button>
        <div id="newCampaignDiv">
            <label>Name</label><br />
            <input type="text" id="newCampaignName" />
            <button id="saveNewCampaignButton">Save</button>
            <button id="cancelButtonNewCampaign">Cancel</button>
        </div>

        <div id="campaignList">
            <!-- Qui verranno visualizzate le campagne -->
        </div>
    </div>

    <!-- Firebase SDK - AGGIUNGI QUESTI SCRIPT QUI -->
    <!-- Utilizzo della versione 9 modulare, più moderna e performante -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";
        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-database.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCkTEfOd8TgMBlmuOJrv238pwvABMjTsE8",
            authDomain: "dnd-campaign-bd8a6.firebaseapp.com",
            databaseURL: "https://dnd-campaign-bd8a6-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dnd-campaign-bd8a6",
            storageBucket: "dnd-campaign-bd8a6.firebasestorage.app",
            messagingSenderId: "913430089577",
            appId: "G-SCJ570LZQG" // SOSTITUISCI
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        window.auth = getAuth(app); // Rendi auth globale accessibile da script.js
        window.database = getDatabase(app); // Rendi database globale accessibile da script.js
        window.firebaseFunctions = { // Funzioni Firebase che useremo in script.js
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            signOut,
            onAuthStateChanged,
            ref, push, set, onValue, remove
        };
    </script>
    <!-- Fine Firebase SDK -->

    <script src="script.js"></script>
</body>
</html>
